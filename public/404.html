<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <!--
        Truque para SPAs no GitHub Pages: como o GitHub Pages não sabe lidar
        com rotas internas do React Router (ex: /film/123), ele cai aqui
        quando a rota não existe como arquivo real. Guardamos a URL que o
        usuário tentou acessar e redirecionamos para a raiz do site, onde
        o React consegue assumir e mostrar a rota certa.
    -->
    <script>
        sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/visualizador-filmes-ghibli/'" />
</head>

<body>
</body>

</html>
